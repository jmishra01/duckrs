name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The DuckDB commit the port follows, which `known_passing.txt` and docs/STATUS.md are measured against
  # (`Baseline:` in docs/STATUS.md). Move it with them.
  DUCKDB_BASELINE: d4eea3f208d42ca4ee522aca23f5ea76f902b0ca

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  miri:
    # Checks the unsafe code in pintail-common (string_t, vector buffers) for undefined behavior.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # `+nightly`: rust-toolchain.toml pins the stable toolchain, which has no Miri
      - run: cargo +nightly miri test -p pintail-common
        env:
          PROPTEST_CASES: "8"
          MIRIFLAGS: -Zmiri-disable-isolation

  sqllogictest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the DuckDB test corpus at the baseline
        uses: actions/checkout@v4
        with:
          repository: jmishra01/duckdb
          ref: ${{ env.DUCKDB_BASELINE }}
          path: duckdb
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p sqllogictest
      - name: Run the corpus against pintail (fails only on regressions)
        # The runner has 4 cores and 16 GiB. Some files of the corpus build very large intermediate
        # results, and four at once ran the machine out of memory, which took the runner down with them
        # ("received a shutdown signal"). Two at a time, each test process limited to 6 GiB of address
        # space, so a file that needs more fails on its own. Memory and disk are logged every minute so
        # that a run that still dies shows why.
        run: |
          ( while sleep 60; do echo "[monitor] $(free -m | awk '/^Mem:/ {print "mem used " $3 " MiB of " $2 ", available " $7}'); $(df -h . | awk 'NR==2 {print "disk used " $3 " of " $2}')"; done ) &
          ulimit -v 6291456
          ./target/release/sqllogictest -j 2 --duckdb-root duckdb --allow-failures --isolate --timeout 60 \
            --known-passing tools/sqllogictest/known_passing.txt \
            --status-out STATUS.md
      - name: Memory and disk after a failure
        if: failure()
        run: |
          free -m
          df -h
          sudo dmesg | grep -i -E 'killed process|out of memory' | tail -20 || true
      - name: Parse and transform the corpus (parse rate >= 99.9%, every transformed SELECT round trips)
        run: cargo run --release -q -p pintail-parser --example corpus -- duckdb --min-parse 99.9 --min-transform 99.99 --min-reject 88
      - uses: actions/upload-artifact@v4
        with:
          name: sqllogictest-status
          path: STATUS.md
