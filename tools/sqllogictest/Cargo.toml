[package]
name = "sqllogictest"
description = "Runs DuckDB's sqllogictest corpus against pintail or the C++ reference engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
# Link the C++ DuckDB reference engine (compiles DuckDB from source on first build).
reference = ["dep:libduckdb-sys"]

[dependencies]
pintail.workspace = true
clap.workspace = true
md-5.workspace = true
regex.workspace = true
walkdir.workspace = true
libc.workspace = true
libduckdb-sys = { workspace = true, optional = true }

[lints]
workspace = true
