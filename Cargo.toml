[workspace]
resolver = "3"
members = ["crates/duckrs", "crates/duckrs-cli", "crates/duckrs-common", "crates/duckrs-core", "crates/duckrs-main", "crates/duckrs-parser", "crates/duckrs-tpcds", "tools/benchmark", "tools/sqllogictest"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/jmishra01/duckrs"

[workspace.dependencies]
libm = "0.2"
libc = "0.2"
sha1 = "0.10"
sha2 = "0.10"
ring = "0.17"
arrow = { version = "60", default-features = false }
parquet = { version = "60", features = ["arrow_canonical_extension_types"] }
duckrs = { path = "crates/duckrs" }
duckrs-common = { path = "crates/duckrs-common" }
duckrs-core = { path = "crates/duckrs-core" }
duckrs-main = { path = "crates/duckrs-main" }
duckrs-parser = { path = "crates/duckrs-parser" }
duckrs-tpcds = { path = "crates/duckrs-tpcds" }
parking_lot = "0.13"
proptest = "1.12"
criterion = "0.8"
clap = { version = "4.6", features = ["derive"] }
flate2 = "1.1"
snap = "1.1"
brotli = "9.1"
lz4_flex = "0.14"
zstd = "0.14"
twox-hash = { version = "2.1", default-features = false, features = ["xxhash64"] }
md-5 = "0.11"
regex = "1.13"
memchr = "2.8"
hashbrown = "0.17"
unicode-normalization = "0.1"
unicode-segmentation = "1.13"
walkdir = "2.5"
rustyline = { version = "19", default-features = false, features = ["with-file-history"] }
libduckdb-sys = { version = "1.20000.1", features = ["bundled", "parquet", "json"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
debug = "line-tables-only"
